<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creatine90</title>

  <!-- 1) Instant browser-level redirect -->
  <meta http-equiv="refresh" content="0; url=https://apps.apple.com/dk/app/creatine90/id6778004930">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #c6ff00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .wrap { padding: 24px; }
    .day {
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 14px;
    }
    .title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    .msg { font-size: 15px; opacity: 0.7; margin-bottom: 26px; }
    a.btn {
      display: inline-block;
      border: 1px solid #c6ff00;
      color: #c6ff00;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="day">Creatine90</div>
    <div class="title">Taking you to the App Store…</div>
    <div class="msg">If it doesn't open automatically, tap below:</div>
    <a class="btn" id="fallback" href="https://apps.apple.com/dk/app/creatine90/id6778004930">Open Creatine90 →</a>
  </div>

  <!-- 2) JS redirect as a backup -->
  <script>
    window.location.replace("https://apps.apple.com/dk/app/creatine90/id6778004930");
  </script>
</body>
</html>
